[package]
name = "conc_bug_detector"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pn"
path = "src/bin/pn.rs"

[[bin]]
name = "cargo-pn"
path = "src/bin/cargo-pn.rs"

[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
directories = { version = "6.0.0", optional = true }
rustc_version = { version = "0.4.1", optional = true }
getrandom = { version = "0.4.2", features = ["std"] }
byteorder = "1.3"
env_logger = "0.11.10"
log = "0.4.30"
shell-escape = "0.1.5"
hex = "0.4.0"
rand = "0.10.1"
clap = "4.6.1"
shellwords = "1.1.0"
petgraph = "0.8.3"
bitflags = "2.11.1"
smallvec = { version = "1.15.0", features = ["serde"] }
serde_json = "1.0.150"
serde = { version = "1.0.215", features = ["derive"] }
serde_yaml = "0.9"
ron = "0.12.1"
regex = "1.12.3"
once_cell = "1.21.4"
itertools = "0.15.0"
toml = "1.1.2"
thiserror = "2.0.18"
anyhow = "1.0.102"
nom = "*"
libc = "0.2.186"
indexmap = "2.14.0"
rayon = "1.10"
criterion = { version = "0.8.2", optional = true }
num = { version = "0.4", optional = true }
num-rational = { version = "0.4", optional = true }
num-bigint = { version = "0.5", optional = true }

[features]
default = []
bench = ["criterion"]
inhibitor = []
reset = []
pnml = []
invariants = ["num", "num-rational", "num-bigint"]

[profile.dev]
incremental = false
panic = "unwind"

[package.metadata.rust-analyzer]
rustc_private = true
