[package]
name = "spn"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
cargo_metadata = { version = "0.23.1", optional = true }
directories = { version = "6.0.0", optional = true }
rustc_version = { version = "0.4.1", optional = true }
env_logger = "0.11.10"
log = "0.4.30"
clap = "4.6.1"
shellwords = "1.1.0"
petgraph = "0.8.3"
smallvec = { version = "1.15.0", features = ["serde"] }
serde_json = "1.0.150"
serde = { version = "1.0.215", features = ["derive"] }
# Pinned to UniPN main rev with CTL/LTL & stuttering refinement support.
unipn = { git = "https://github.com/kevindadi/UniPN", rev = "77f7334bf8f714a80b55bc2c0c48deb88cc3a576" }
regex = "1.12.3"
once_cell = "1.21.4"
toml = "1.1.2"
anyhow = "1.0.102"
nom = "*"
libc = "0.2.186"
indexmap = "2.14.0"
criterion = { version = "0.8.2", optional = true }

[features]
default = []
bench = ["criterion"]
inhibitor = []
reset = []
pnml = []

[profile.dev]
incremental = false
panic = "unwind"

[package.metadata.rust-analyzer]
rustc_private = true
