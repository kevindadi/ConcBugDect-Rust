[package]
name = "rust_pta_async"
version = "0.1.0"
edition = "2024"
description = "RustPTA async extension crate — async alias analysis and translation without modifying core."

[lib]
path = "src/lib.rs"

[[bin]]
name = "pn-async"
path = "src/bin/pn-async.rs"

[[bin]]
name = "cargo-pn-async"
path = "src/bin/cargo-pn-async.rs"

[dependencies]
rust_petri_net_analysis = { path = "../.." }
log = "0.4.30"
env_logger = "0.11.10"
clap = "4.6.1"
serde = { version = "1.0.215", features = ["derive"] }

[package.metadata.rust-analyzer]
rustc_private = true
