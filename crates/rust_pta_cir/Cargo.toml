[package]
name = "rust_pta_cir"
version = "0.1.0"
edition = "2024"
description = "Sync experiment: convert RustPTA Petri nets to CIR (Concurrency Intermediate Representation)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "pn-cir-export"
path = "src/bin/pn-cir-export.rs"

[dependencies]
rust_petri_net_analysis = { path = "../.." }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
indexmap = "2.14.0"
log = "0.4.30"

[dev-dependencies]
tempfile = "3.25.0"

[package.metadata.rust-analyzer]
rustc_private = true
